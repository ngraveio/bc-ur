name: Sync beta with main

on:
  push:
    branches:
      - main

jobs:
  sync-main-branch:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create PR from main to beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Check if a pull request already exists from main to beta
          pr_url=$(gh pr list --head main --base beta --json url --jq '.[0].url')
          
          if [ -n "$pr_url" ]; then
            echo "PR already exists: $pr_url"
          else
            pr_url=$(gh pr create \
              --head main \
              --base beta \
              --title "[skip ci][skip release] Sync beta with the main branch" \
              --body "Auto-created pull request to merge changes from main into beta."
            )
            echo "Created PR: $pr_url"
          fi
